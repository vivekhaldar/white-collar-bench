name: pi-litellm-gpt-6.1-sol
version: pi-1.5.2-runtime-v2
model: litellm/gpt-6.1-sol
description: Fresh Pi sessions over a LiteLLM proxy (OpenAI Responses API), medium reasoning effort, pinned document readers, bounded bash, 120-turn budget, provider key kept outside the sandbox
cmd: [python, -I, "{adapter_dir}/pi_litellm.py"]
ingest:
  timeout_s: 1800
query:
  timeout_s: 900
env: {WCB_MODEL: gpt-6.1-sol, WCB_PI_API: openai-responses}
env_passthrough: [LITELLM_API_KEY, WCB_PI_NODE_MODULES, WCB_TOOLS_VENV]
