[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "white-collar-bench"
version = "0.1.0"
description = "Benchmark for agents that maintain a knowledge worker's store of projects, open loops, decisions and people"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.17",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wcb = "wcb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wcb"]

[tool.hatch.build.targets.wheel.force-include]
"contract" = "wcb/_contract"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["worlds"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
